<!DOCTYPE html>
<html>
<head>
    <title>Category - Arjun's Asset Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="assets/logo.png" alt="logo">
</head>
<body>
    <nav>
        <a class="brand" href="index.html">
            <img class="logo" src="assets/logo.png" alt="logo">
            Arjun's Asset Hub
        </a>

        <div class="nav-home">
            <a href="index.html">Home</a>
        </div>

        <div class="nav-links">
            <a class="nav-store" href="store.html">Asset Store</a>
            <a href="https://github.com/ar-bh/arjuns-asset-hub" target="_blank">Source</a>
            <a href="">Donate</a>
        </div>

    </nav>

    <main>
        <h1 id="category-title" class="page-title"></h1>
        <p class="byline">projects</p>
        <div id="projects"class="card-list"></div>
    </main>

    <script src="load-store.js"></script>
    <script>
    loadStore().then(function () {
        const params = new URLSearchParams(window.location.search);
        const categoryName = params.get("name");
        const category = store[categoryName];
        const projects = category ? category.projects : null;

        document.getElementById("category-title").textContent = categoryName || "Unknown";
        document.title = (categoryName || "Category") + " - Arjun's Asset Hub";

        const box = document.getElementById("projects");

        function addCard(label, href, image, extraClass) {
            const card = document.createElement(href ? "a": "div");
            card.className = "tile" + (extraClass ? " " + extraClass : "");
            const text = document.createElement("span");
            text.className = "tile-label";
            text.textContent = label;
            card.appendChild(text);
            if (href) {
                card.href = href;
            }
            if (image) {
                card.style.setProperty("--tile-image", "url('" + image + "')");
            }
            box.appendChild(card);
        }

        if (!projects) {
            box.textContent = "No projects in this category yet.";
        } else {
            for (const project of Object.values(projects)) {
                addCard(
                    project.name,
                    "project.html?category=" + encodeURIComponent(categoryName)
                    + "&name=" + encodeURIComponent(project.name),
                    project.image
                )
            }
            addCard("coming soon", "", "", "soon");
        }
    });
    </script>


</body>

</html>
